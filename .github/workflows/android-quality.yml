name: Android quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Android quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Kotlin formatting
        run: bash ./gradlew ktlintCheck --console=plain
      - name: JVM tests
        if: ${{ !cancelled() }}
        run: bash ./gradlew :app:testDebugUnitTest --console=plain
      - name: Debug build
        if: ${{ !cancelled() }}
        run: bash ./gradlew :app:assembleDebug --console=plain
      - name: Android lint
        if: ${{ !cancelled() }}
        run: bash ./gradlew :app:lintDebug --console=plain
      - name: Upload QA reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-quality-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/reports/ktlint/
            app/build/reports/
            app/build/test-results/testDebugUnitTest/
